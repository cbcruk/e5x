name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Run manually on main to redeploy the demo: Pages follows a successful CI run.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Installs vp (version from the pnpm catalog), Node, and runs `vp install`.
      - uses: voidzero-dev/setup-vp@v1.20.0
        with:
          node-version: '24'
          cache: true
      - run: vp check
      - run: vp run typecheck
      - run: vp run docs:check
      - run: vp run test
      # The script, not the built-in: it also emits dist/index.production.js, which `size` needs.
      - run: vp run build
      - run: vp run size
      - run: vp run build:demo

  # Headless Chromium: the observer-driven suites again (happy-dom has differed from real
  # browsers before) and the garbage collection tests. A separate job so it runs alongside
  # `check`; Pages waits for both.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.20.0
        with:
          node-version: '24'
          cache: true
      # Headless runs use Chromium's headless shell, so the full browser is not needed.
      - run: vp exec playwright install --with-deps --only-shell chromium
      - run: vp run test:browser
